<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siddhu Property Advisor | Chichawatni Blog</title>
  <meta name="description" content="Read the latest insights and guides on buying, selling, and verifying property in Chichawatni. Expert advice from Siddhu Property Advisor.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 40 40' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M8 32 L8 12 L20 4 L32 12 L32 32' stroke='%23B88A3B' stroke-width='1.5' stroke-linejoin='round' opacity='0.4'/%3E%3Cpath d='M14 32 L14 16 L20 12 L26 16 L26 32' stroke='%23B88A3B' stroke-width='1' stroke-linejoin='round' opacity='0.2'/%3E%3Cpath d='M26 18 C26 15.5 24 14 20 14 C16 14 14 16 14 18.5 C14 21.5 26 21.5 26 24.5 C26 27.5 24 29 20 29 C16 29 14 27.5 14 25' stroke='%23B88A3B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='18.5' y='20.5' width='3' height='3' transform='rotate(45 20 22)' fill='%23B88A3B' /%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <!-- marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .article-header {
      padding: 140px 0 40px;
      background: var(--bg-main);
      border-bottom: 1px solid var(--border);
    }
    .breadcrumb {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .breadcrumb a {
      color: var(--gold-primary);
      text-decoration: none;
    }
    .article-meta {
      display: flex;
      gap: 16px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }
    .article-title {
      font-family: var(--font-heading);
      font-size: clamp(2.2rem, 4vw, 3.5rem);
      line-height: 1.1;
      margin-bottom: 24px;
      color: var(--text-main);
    }
    .article-thumbnail {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: var(--radius-lg);
      margin-bottom: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .article-body {
      max-width: 800px;
      margin: 0 auto;
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--text-main);
      padding: 40px 0 80px;
    }
    .article-body h2 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      margin: 40px 0 20px;
      color: var(--text-main);
    }
    .article-body h3 {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      margin: 30px 0 15px;
    }
    .article-body p {
      margin-bottom: 20px;
    }
    .article-body ul, .article-body ol {
      margin-bottom: 24px;
      padding-left: 24px;
    }
    .article-body li {
      margin-bottom: 10px;
    }
    .article-body blockquote {
      border-left: 4px solid var(--gold-primary);
      padding: 16px 24px;
      margin: 30px 0;
      background: var(--bg-secondary);
      font-style: italic;
      color: var(--text-secondary);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }
    .article-body strong {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav-wrapper">
      <a href="../index.html" class="logo-brand-wrap">
        <div class="logo-crest-box">
          <svg class="logo-svg-emblem" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="SIDDHU Property Advisor Logo">
            <path d="M8 32 L8 12 L20 4 L32 12 L32 32" stroke="url(#premiumGoldArticle)" stroke-width="1.5" stroke-linejoin="round" opacity="0.4"/>
            <path d="M14 32 L14 16 L20 12 L26 16 L26 32" stroke="url(#premiumGoldArticle)" stroke-width="1" stroke-linejoin="round" opacity="0.2"/>
            <path d="M26 18 C26 15.5 24 14 20 14 C16 14 14 16 14 18.5 C14 21.5 26 21.5 26 24.5 C26 27.5 24 29 20 29 C16 29 14 27.5 14 25" stroke="#B88A3B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="18.5" y="20.5" width="3" height="3" transform="rotate(45 20 22)" fill="#B88A3B" />
            <defs>
              <linearGradient id="premiumGoldArticle" x1="8" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop stop-color="#B88A3B"/>
                <stop offset="1" stop-color="#8A6428"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="logo-title-group">
          <div class="logo-title"><span>SIDDHU</span> <span class="highlight-accent">PROPERTY</span></div>
          <div class="logo-subtitle">REAL ESTATE ADVISOR</div>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="index.html">Blog</a></li>
      </ul>
    </div>
  </header>

  <article>
    <div class="article-header">
      <div class="container" style="max-width: 800px;">
        <div class="breadcrumb">
          <a href="../index.html">Home</a> / <a href="index.html">Blog</a> / <span id="breadCat">Loading...</span>
        </div>
        <div class="article-meta">
          <span id="metaDate"><i class="fa-solid fa-calendar"></i> ...</span>
          <span id="metaAuthor"><i class="fa-solid fa-user"></i> ...</span>
        </div>
        <h1 class="article-title" id="articleTitle">Loading Article...</h1>
      </div>
    </div>

    <div class="container" style="max-width: 900px; margin-top: -20px;">
      <img id="articleThumb" src="" alt="Thumbnail" class="article-thumbnail" style="display: none;">
    </div>

    <div class="container">
      <div class="article-body" id="articleBody">
        <p style="text-align: center; color: var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> Loading content...</p>
      </div>
    </div>
  </article>

  <footer style="background: var(--bg-secondary); padding: 40px 0; border-top: 1px solid var(--border); text-align: center;">
    <p style="color: var(--text-muted);">&copy; 2026 Siddhu Property Advisor.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('id');

      if (!postId) {
        document.getElementById('articleBody').innerHTML = '<h2>Article not found</h2>';
        return;
      }

      // Fetch metadata
      try {
        const res = await fetch('posts.json');
        const posts = await res.json();
        const postMeta = posts.find(p => p.id === postId);

        if (postMeta) {
          document.title = postMeta.title + " | Siddhu Property";
          document.getElementById('articleTitle').innerText = postMeta.title;
          document.getElementById('breadCat').innerText = postMeta.category;
          document.getElementById('metaDate').innerHTML = `<i class="fa-solid fa-calendar"></i> ${postMeta.date}`;
          document.getElementById('metaAuthor').innerHTML = `<i class="fa-solid fa-user"></i> ${postMeta.author}`;
          
          const thumb = document.getElementById('articleThumb');
          thumb.src = postMeta.thumbnail;
          thumb.style.display = 'block';
        }

        // Fetch Markdown content
        const mdRes = await fetch(`../posts/${postId}.md`);
        if (mdRes.ok) {
          const mdText = await mdRes.text();
          // Remove H1 if it's identical to the title to avoid duplication
          let cleanMd = mdText;
          if (postMeta && cleanMd.startsWith('# ' + postMeta.title)) {
            cleanMd = cleanMd.replace('# ' + postMeta.title, '');
          }
          
          document.getElementById('articleBody').innerHTML = marked.parse(cleanMd);
        } else {
          document.getElementById('articleBody').innerHTML = '<p>Error loading article content.</p>';
        }
      } catch (e) {
        document.getElementById('articleBody').innerHTML = '<p>Failed to load the article.</p>';
        console.error(e);
      }
    });
  </script>
</body>
</html>
